<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAPLE BBC</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #38bdf8;
            --secondary: #22c55e;
            --error: #ef4444;
            --text: #f8fafc;
            --muted: #64748b;
            --gold: #fbbf24;
            --border: #334155;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 15px;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            padding: 24px;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .header h2 { 
            text-align: center; 
            color: var(--primary); 
            font-size: 1.6rem; 
            letter-spacing: 4px; 
            margin: 0 0 24px 0; 
            font-weight: 900;
            text-transform: uppercase;
        }

        /* Match Board */
        .match-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .team-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            width: 35%;
        }

        .team-name { 
            font-size: 0.75rem; 
            font-weight: 800; 
            color: var(--primary);
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .match-score { font-size: 2.4rem; font-weight: 900; color: var(--secondary); line-height: 1; }

        /* Teams Grid */
        .teams-grid { display: flex; gap: 16px; margin-bottom: 24px; }
        .team-box {
            flex: 1;
            background: rgba(255,255,255,0.03);
            padding: 20px 12px;
            border-radius: 24px;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .score-display { font-size: 3.8rem; font-weight: 900; margin: 8px 0; line-height: 1; color: var(--text); }
        
        /* Consistent SVG Icons */
        .btn-icon {
            background: rgba(255,255,255,0.06);
            border: none;
            border-radius: 10px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0 auto 8px;
            transition: all 0.2s;
        }
        .btn-icon svg { width: 18px; height: 18px; fill: var(--muted); }
        .btn-icon:hover { background: rgba(56, 189, 248, 0.15); }
        .btn-icon:hover svg { fill: var(--primary); }

        .name-edit-icon svg { width: 12px; height: 12px; fill: var(--muted); margin-top: 2px; }

        input[type="number"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: white;
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 12px;
            outline: none;
            font-weight: bold;
        }

        .btn-add { 
            background: var(--secondary); 
            color: #064e3b; 
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* Tables Section */
        .section { margin-top: 20px; }
        .section-label { 
            font-size: 0.65rem; 
            color: var(--muted); 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            margin-bottom: 10px; 
            display: block; 
            text-align: center; 
        }

        .table-card {
            background: rgba(0,0,0,0.15);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid var(--border);
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { color: var(--muted); padding-bottom: 8px; font-size: 0.7rem; }
        td { text-align: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .gold-text { color: var(--gold); font-weight: bold; }

        .btn-reset { 
            background: transparent; 
            color: var(--error); 
            border: 1px solid var(--error); 
            margin-top: 30px; 
            font-size: 0.75rem; 
            padding: 12px;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h2>GAPLE BBC</h2></div>
    
    <div class="match-board">
        <div class="team-info" onclick="gantiNama('A')">
            <span class="team-name" id="labelA">TIM A</span>
            <span class="name-edit-icon"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></span>
        </div>
        <div class="match-score"><span id="mScoreA">0</span> : <span id="mScoreB">0</span></div>
        <div class="team-info" onclick="gantiNama('B')">
            <span class="team-name" id="labelB">TIM B</span>
            <span class="name-edit-icon"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></span>
        </div>
    </div>

    <div class="teams-grid">
        <div class="team-box">
            <button class="btn-icon" onclick="editSkor('A')">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>
            <div class="score-display" id="dispA">0</div>
            <input type="number" id="inputA" placeholder="+" inputmode="numeric">
            <button class="btn-add" onclick="prosesTambah('A')">TAMBAH</button>
        </div>

        <div class="team-box">
            <button class="btn-icon" onclick="editSkor('B')">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>
            <div class="score-display" id="dispB">0</div>
            <input type="number" id="inputB" placeholder="+" inputmode="numeric">
            <button class="btn-add" onclick="prosesTambah('B')">TAMBAH</button>
        </div>
    </div>

    <div class="section">
        <span class="section-label">Riwayat Ronde</span>
        <div class="table-card" style="max-height: 100px; overflow-y: auto;">
            <table><tbody id="historyBody"></tbody></table>
        </div>
    </div>

    <div class="section">
        <span class="section-label">🏆 Leaderboard (Poin Kalah Terbesar)</span>
        <div class="table-card">
            <table>
                <thead><tr><th>TIM</th><th>SKOR</th></tr></thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </div>

    <button class="btn-reset" onclick="resetTotal()">RESET SEMUA DATA</button>
</div>

<script>
    let data = JSON.parse(localStorage.getItem('gapleBBC_v2')) || {
        skorA: 0, skorB: 0, winA: 0, winB: 0, 
        namaA: "TIM A", namaB: "TIM B", 
        history: [], leaderboard: []
    };

    function updateLayar() {
        document.getElementById('dispA').innerText = data.skorA;
        document.getElementById('dispB').innerText = data.skorB;
        document.getElementById('mScoreA').innerText = data.winA;
        document.getElementById('mScoreB').innerText = data.winB;
        document.getElementById('labelA').innerText = data.namaA;
        document.getElementById('labelB').innerText = data.namaB;
        
        renderHistory();
        renderLeaderboard();
        localStorage.setItem('gapleBBC_v2', JSON.stringify(data));
    }

    function renderHistory() {
        const body = document.getElementById('historyBody');
        body.innerHTML = '';
        data.history.forEach(item => {
            body.innerHTML = `<tr><td>${item.a || '-'}</td><td>${item.b || '-'}</td></tr>` + body.innerHTML;
        });
    }

    function renderLeaderboard() {
        const lbBody = document.getElementById('leaderboardBody');
        lbBody.innerHTML = '';
        const sortedLB = [...data.leaderboard].sort((a, b) => b.score - a.score).slice(0, 5);
        sortedLB.forEach(item => {
            lbBody.innerHTML += `<tr><td class="gold-text">${item.name}</td><td class="gold-text">${item.score}</td></tr>`;
        });
    }

    function gantiNama(tim) {
        let n = prompt("Ganti Nama Tim:", tim === 'A' ? data.namaA : data.namaB);
        if (n && n.trim() !== "") {
            if (tim === 'A') data.namaA = n.toUpperCase();
            else data.namaB = n.toUpperCase();
            updateLayar();
        }
    }

    function prosesTambah(tim) {
        const input = document.getElementById('input' + tim);
        const val = parseInt(input.value);
        if (isNaN(val) || val < 11) return alert("Minimal 11 poin!");
        
        if (tim === 'A') { data.skorA += val; data.history.push({a: val, b: ''}); }
        else { data.skorB += val; data.history.push({a: '', b: val}); }

        input.value = '';
        updateLayar();
        cekKalah();
    }

    function editSkor(tim) {
        let input = prompt(`Koreksi Skor ${tim === 'A' ? data.namaA : data.namaB}:`, tim === 'A' ? data.skorA : data.skorB);
        if (input !== null) {
            let n = parseInt(input);
            if (isNaN(n) || (n > 0 && n < 11)) return alert("Skor minimal 11!");
            if (tim === 'A') data.skorA = n; else data.skorB = n;
            data.history.push({a: tim === 'A' ? 'EDIT' : '', b: tim === 'B' ? 'EDIT' : ''});
            updateLayar();
            cekKalah();
        }
    }

    function cekKalah() {
        setTimeout(() => {
            let loser = ""; let scoreKalah = 0;
            if (data.skorA >= 100) { loser = data.namaA; scoreKalah = data.skorA; data.winB++; }
            else if (data.skorB >= 100) { loser = data.namaB; scoreKalah = data.skorB; data.winA++; }

            if (loser !== "") {
                alert(`${loser} KALAH!\nSkor Akhir: ${scoreKalah}`);
                data.leaderboard.push({ name: loser, score: scoreKalah });
                data.skorA = 0; data.skorB = 0; data.history = [];
                updateLayar();
            }
        }, 100);
    }

    function resetTotal() {
        if (confirm("Reset seluruh data aplikasi?")) {
            data = { skorA: 0, skorB: 0, winA: 0, winB: 0, namaA: "TIM A", namaB: "TIM B", history: [], leaderboard: [] };
            updateLayar();
        }
    }

    updateLayar();
</script>

</body>
</html>
